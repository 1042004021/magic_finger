name: Publish beta release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files
        run: |
          DIR="release-assets/${GITHUB_REF_NAME}"
          test -d "$DIR" || { echo "Missing $DIR"; exit 1; }
          cd "$DIR" && sha256sum -c SHA256SUMS
      - name: Publish beta prerelease and installers
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const props = fs.readFileSync('module/module.prop', 'utf8');
            if (!props.includes(`version=${version}`)) {
              throw new Error(`module.prop version does not match tag ${tag}`);
            }
            const versionCode = /versionCode=(\d+)/.exec(props)[1];
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `魔法手指 ${tag} · Beta 测试版`,
              draft: false,
              prerelease: true,
              body: [
                '## 更新内容',
                '- APK 移除总开关和启动按钮，刷入模块即代表开启。',
                '- 设置页重做为深色卡片界面，新增悬浮窗授权状态提示。',
                '- 关闭方式改为停用或卸载模块后重启。',
                '',
                '## 已知问题与验证边界',
                '- 普通悬浮层不能覆盖部分系统界面。',
                '- 高层光环探针会阻挡下层点击、滑动，验收失败，不可作为常驻方案使用。',
                '- Magisk / APatch 未实机验证，旋转、多屏、多用户和长期功耗未完成验证。',
                '- 正常服务仍使用普通应用悬浮窗，不启用高层探针。',
                '',
                '## 安装',
                `安装 magic-finger-${version}.apk 并授予悬浮窗权限；APK 只调样式，没有开关。按实际 Root 框架选择 kernelsu / magisk / apatch 中一个模块 ZIP，通过对应管理器安装后重启，模块即自动开启。`,
                `关闭效果需停用或卸载模块后重启。APK 沿用开发机原测试签名，versionCode=${versionCode}；并非生产签名。`,
                'SHA256SUMS 提供附件校验。GitHub 自动生成的 Source code ZIP 不能作为模块刷入。',
                '',
                '构建、安装及详细验证记录请阅读 README.md、MODULE.md 和 CHANGELOG.md。'
              ].join('\n')
            });
            const directory = `release-assets/${tag}`;
            for (const name of fs.readdirSync(directory)) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name,
                data: fs.readFileSync(`${directory}/${name}`)
              });
            }